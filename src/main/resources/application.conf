akka {
  actor {

  }
}

cpu-dispatcher {
  type = Dispatcher
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-min = 8
    parallelism-max = 8
  }
}

akka-kryo-serialization {
  type = "graph"
  id-strategy = "incremental"
  serialize-lambdas = true
  # Required to handle Scala closure capture safely
  kryo-initializer = "io.altoo.akka.serialization.kryo.DefaultKryoInitializer"
}